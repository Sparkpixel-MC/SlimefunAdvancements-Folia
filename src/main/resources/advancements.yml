# 每个成就的可用配置项:
#   group: 进度组 (必填, 对应 groups.yml 中的键)
#   parent: 父进度 (可选, 默认为所在进度组)
#   display: 展示物品 (必填), 其 name/lore 显示在进度 GUI 中
#   frame_type: TASK / GOAL / CHALLENGE (可选, 默认 TASK)
#   name: 进度名称 (可选, 默认为键名), 用于公告消息
#   description: 进度描述 (可选, 支持单个字符串或字符串列表), 用于原版进度界面和公告悬浮提示
#               未指定时自动使用 display.name + display.lore 生成
#   hidden: 是否隐藏 (可选)
#   criteria: 完成条件 (必填)
#   rewards: 奖励命令 (可选), %p% 为玩家名

portable_workbench:
  group: basic
  display:
    type: CRAFTING_TABLE
    name: "&a便携合成"
    lore:
      - "使用一次便携工作台"
  frame_type: GOAL
  name: "&a[便携合成]"
  description: "使用一次便携工作台"
  criteria:
    interact:
      name: "使用一次便携工作台"
      type: interact
      amount: 1
      item:
        type: PORTABLE_CRAFTER
  rewards:
    commands:
      - "experience add %p% 3 levels"

