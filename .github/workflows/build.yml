name: Build And Release

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  Build:
    name: Build Plugin
    runs-on: ubuntu-latest
    outputs:
      Jar_Name: ${{ steps.Find_Jar.outputs.Jar_Name }}
      Version: ${{ steps.Get_Version.outputs.Version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Get Version from Gradle
        id: Get_Version
        run: |
          set -e
          VERSION=$(./gradlew properties -q | grep '^version:' | awk '{print $2}' | head -n1)
          VERSION=${VERSION#v}
          if [ -z "$VERSION" ]; then
            echo "Failed to read version from Gradle" >&2
            exit 1
          fi
          echo "Version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Build
        run: ./gradlew build

      - name: Locate JAR
        id: Find_Jar
        run: |
          set -e
          JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-unshaded.jar' 2>/dev/null | head -n 1)
          if [ -z "$JAR" ]; then
            echo "No non-unshaded JAR found in build/libs" >&2
            ls -la build/libs || true
            exit 1
          fi
          echo "Jar_Path=$JAR" >> "$GITHUB_OUTPUT"
          echo "Jar_Name=$(basename "$JAR")" >> "$GITHUB_OUTPUT"
          echo "Selected JAR: $JAR"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SlimefunAdvancements
          path: ${{ steps.Find_Jar.outputs.Jar_Path }}
          if-no-files-found: error

  Release:
    name: Publish Release
    needs: Build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: SlimefunAdvancements
          path: Release-Assets

      - name: List Release Assets
        run: |
          find Release-Assets -type f | sort

      - name: Publish Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ needs.Build.outputs.Version }}
          name: SlimefunAdvancements v${{ needs.Build.outputs.Version }}
          prerelease: false
          allowUpdates: true
          makeLatest: true
          artifactErrorsFailBuild: true
          removeArtifacts: true
          artifacts: Release-Assets/*.jar
          body: |
            ## 🚀 SlimefunAdvancements v${{ needs.Build.outputs.Version }}

            Automated build triggered by commit `${{ github.sha }}` on `${{ github.ref_name }}`.

            ### 📦 Included Artifacts
            - **Plugin JAR**: `${{ needs.Build.outputs.Jar_Name }}`

            ### 🛠️ Installation
            1. Download the JAR from the assets below.
            2. Place it into your server's `plugins/` folder.
            3. Restart your server.

            Requires: Slimefun, GuizhanLibPlugin. Folia 26.2 is fully supported (vanilla Paper servers are supported too).

            ### 📝 Changelog
            The full changelog is auto-generated below. 👇

            ---
            _If you encounter any issues, please open an Issue and include your environment, modules, logs, config snippets, and reproduction steps._
          generateReleaseNotes: true
